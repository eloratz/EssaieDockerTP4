on:
  pull_request:
    branches: ["master"]
jobs:
  code-quality:
    name: job1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-app-react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  docker-build-test:
    name: job2
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: ./mon-app-react
        severity: HIGH,CRITICAL
        exit-code: '1'
    - run: docker compose build

  Push-to-registry:
    name: docker
    runs-on: ubuntu-latest
    needs: [code-quality, docker-build-test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./mon-app-react
          push: true
          tags: |
            eloratzz/mon-app-react:latest       
            eloratzz/mon-app-react:${{ github.sha }}
