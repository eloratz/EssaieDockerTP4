on:
  pull_request:
    branches: ["main"]
jobs:
  Linter_formatter:
    name: job1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-app-react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  Docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: docker compose build